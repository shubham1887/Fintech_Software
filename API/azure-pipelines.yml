---
name: $(date:yyyy.M.d)-$(Build.SourceBranchName).$(rev:r)
trigger:
  batch: true
  branches:
    include:
      - main
pool:
  name: Default
variables:
  buildConfiguration: Release
  masterBranchName: refs/heads/main
steps:
  - task: PowerShell@2
    name: folderPath
    displayName: Set Folder Path
    inputs:
      targetType: inline
      script: |
        $folderPath = 'C:/publish/Hitachi/API'
        Write-Host "##vso[task.setvariable variable=folderPath]$folderPath"
  - script: dotnet build --configuration $(buildConfiguration)
    displayName: dotnet build $(buildConfiguration)
  - powershell: >
      Remove-Item -Path $(folderPath)/* -Recurse -Force -ErrorAction
      SilentlyContinue
    displayName: Clear publish folder
    condition: eq(variables['Build.SourceBranch'], variables.masterBranchName)
  - script: dotnet publish --configuration $(buildConfiguration) --output
      $(Build.SourcesDirectory)/publish
    displayName: dotnet publish $(buildConfiguration)
    condition: eq(variables['Build.SourceBranch'], variables.masterBranchName)
  - powershell: >
      Remove-Item -Path "$(Build.SourcesDirectory)/publish/*.pdb" -Force
      -ErrorAction SilentlyContinue

      Remove-Item -Path "$(Build.SourcesDirectory)/publish/*.dll.config" -Force -ErrorAction SilentlyContinue

      Remove-Item -Path "$(Build.SourcesDirectory)/publish/*.xml" -Force -ErrorAction SilentlyContinue

      Remove-Item -Path "$(Build.SourcesDirectory)/publish/web.config" -Force -ErrorAction SilentlyContinue

      Remove-Item -Path "$(Build.SourcesDirectory)/publish/appsettings.json" -Force -ErrorAction SilentlyContinue

      Remove-Item -Path "$(Build.SourcesDirectory)/publish/appsettings.Development.json" -Force -ErrorAction SilentlyContinue
    displayName: Remove unwanted files
    condition: eq(variables['Build.SourceBranch'], variables.masterBranchName)
  - task: PowerShell@2
    name: currentDate
    displayName: Set Current Date
    inputs:
      targetType: inline
      script: |
        $currentDate = Get-Date -Format 'dd-MMMM-yyyy'
        Write-Host "##vso[task.setvariable variable=currentDate]$currentDate"
  - task: PublishBuildArtifacts@1
    condition: eq(variables['Build.SourceBranch'], variables.masterBranchName)
    inputs:
      PathtoPublish: $(Build.SourcesDirectory)/publish
      ArtifactName: $(currentDate)
      publishLocation: FilePath
      TargetPath: $(folderPath)
  - task: ArchiveFiles@2
    displayName: Creating Zip Folder
    inputs:
      rootFolderOrFile: $(folderPath)/$(currentDate)
      includeRootFolder: false
      archiveType: zip
      archiveFile: $(folderPath)/$(currentDate).zip
      replaceExistingArchive: true
      verbose: true
  - powershell: >
      Remove-Item -Path "$(Build.SourcesDirectory)\*" -Recurse -Force
      -ErrorAction SilentlyContinue
    displayName: Clean up Build Source Directory
    condition: and(succeeded(), eq(variables['Build.SourceBranch'],
      variables.masterBranchName))
