# ============================================================================
#  Fino — full stack for a Linux server.
#
#      cd deploy/docker && ./install.sh
#
#  install.sh writes .env (secrets, passwords, domain) and then runs:
#      docker compose up -d
#
#  Three containers: the database, the application (API + panel), and Caddy,
#  which terminates TLS and gets a real certificate automatically from Let's
#  Encrypt for the domain in .env.
# ============================================================================

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: fino-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?set SA_PASSWORD in .env}
      # Express is free and caps out at 10 GB per database — fine to start, and the reason the
      # installer asks about expected volume. Set MSSQL_PID=Standard once you have a licence.
      MSSQL_PID: ${MSSQL_PID:-Express}
    volumes:
      - db-data:/var/opt/mssql
    # Not published to the host: only the app container needs to reach the database. Exposing 1433
    # to the internet is how these deployments get owned.
    expose:
      - "1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    image: fino:${FINO_VERSION:-latest}
    container_name: fino-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Double underscore is how .NET maps an environment variable onto nested configuration.
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=${DB_NAME:-FinoApp};User ID=sa;Password=${SA_PASSWORD};MultipleActiveResultSets=False;Encrypt=False;TrustServerCertificate=True;Command Timeout=0;"

      # Per-installation secrets, generated by install.sh. Never reuse these between clients.
      JwtSettings__SecretKey: ${JWT_SECRET:?set JWT_SECRET in .env}
      Encryption__Key: ${AES_KEY:?set AES_KEY in .env}
      Encryption__IV: ${AES_IV:?set AES_IV in .env}

      # First start: create the database, apply the schema, create the first admin.
      Database__AutoSetup: "true"
      Database__SeedAdmin: "true"
      Bootstrap__BrandName: ${BRAND_NAME:-Fino}
      Bootstrap__AdminName: ${ADMIN_NAME:-Administrator}
      Bootstrap__AdminMobile: ${ADMIN_MOBILE:?set ADMIN_MOBILE in .env}
      Bootstrap__AdminEmail: ${ADMIN_EMAIL:-}
      Bootstrap__AdminPassword: ${ADMIN_PASSWORD:-}

      Panel__ServeStaticFiles: "true"
      Cors__AllowedOrigins__0: "https://${DOMAIN:?set DOMAIN in .env}"

      ASPNETCORE_ENVIRONMENT: Production
    volumes:
      # Uploaded KYC documents and service icons. Lose this and KYC evidence is gone.
      - uploads:/app/wwwroot/uploads
      # Branding without a rebuild: drop a config.json here to rename/recolour the panel.
      - ./panel-config.json:/app/wwwroot/panel/config.json:ro
    expose:
      - "8080"

  proxy:
    image: caddy:2-alpine
    container_name: fino-proxy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates. Without this volume every restart asks Let's Encrypt again and runs
      # into their rate limit.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  uploads:
  caddy-data:
  caddy-config:
